<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>谁是卧底 · 观众投票</title>
<style>
  :root{
    --blue:#156082; --blue-d:#0e4760; --blue-l:#e8f1f6;
    --orange:#E97132; --orange-d:#c2551c; --orange-l:#fdf0e7;
    --ink:#1f2b33; --muted:#6b7b86; --line:#d7e2ea; --ok:#1f8a56;
    --red:#c0392b; --red-l:#fdecea;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"FangSong","仿宋","STFangsong",serif;
    background:linear-gradient(160deg,#f4f7fa 0%,#e6eef4 100%);
    color:var(--ink);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:22px 16px calc(22px + env(safe-area-inset-bottom));
  }
  .num{font-family:"Times New Roman",Times,serif;}

  .top{width:100%;max-width:540px;text-align:center;margin-bottom:14px;}
  .top h1{font-size:24pt;letter-spacing:3px;font-weight:normal;color:var(--blue-d);margin-bottom:6px;}
  .top p{font-size:12.5pt;color:var(--muted);line-height:1.5;}

  .wrap{width:100%;max-width:540px;flex:1;display:flex;flex-direction:column;justify-content:center;}

  .stage{
    background:#fff;border-radius:22px;border:2px solid var(--line);
    box-shadow:0 6px 22px rgba(31,43,51,.09);
    padding:24px 20px;text-align:center;min-height:340px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  }

  .prompt{font-size:15pt;color:var(--ink);line-height:1.7;}
  .prompt b{color:var(--orange-d);}

  input[type=text]{
    width:100%;border:2px solid var(--line);border-radius:12px;padding:14px 16px;
    font-family:inherit;font-size:16pt;color:var(--ink);background:#fbfdfe;outline:none;
  }
  input[type=text]:focus{border-color:var(--blue);background:#fff;}
  label.field{width:100%;text-align:left;font-size:13pt;color:var(--muted);margin-bottom:-8px;}

  .btnbig{
    width:100%;border:none;border-radius:14px;cursor:pointer;
    font-family:inherit;font-size:17pt;color:#fff;padding:15px;
    background:var(--blue);transition:all .13s;letter-spacing:2px;
  }
  .btnbig:hover{background:var(--blue-d);}
  .btnbig:disabled{background:#b9c6ce;cursor:not-allowed;}
  .btnbig.orange{background:var(--orange);}
  .btnbig.orange:hover{background:var(--orange-d);}

  .smallbtn{
    border:2px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;
    font-family:inherit;font-size:15pt;color:var(--muted);padding:12px 20px;width:100%;transition:all .13s;
  }
  .smallbtn:hover{border-color:var(--blue);color:var(--blue-d);}
  .rowbtns{display:flex;flex-direction:column;gap:11px;width:100%;}

  /* 身份选择 */
  .idgrid{display:flex;flex-direction:column;gap:12px;width:100%;}
  .idcard{
    border:2px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;
    background:#fff;transition:all .13s;text-align:left;
  }
  .idcard:hover{border-color:var(--blue);background:var(--blue-l);}
  .idcard h3{font-size:17pt;color:var(--blue-d);font-weight:normal;margin-bottom:6px;}
  .idcard p{font-size:12.5pt;color:var(--muted);line-height:1.5;}

  /* 投票宫格 */
  .rounds{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;}
  .round{
    border:2px solid var(--line);border-radius:16px;padding:16px 10px;cursor:pointer;
    background:#fff;transition:all .13s;display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .round:hover{border-color:var(--blue);background:var(--blue-l);}
  .round .rt{font-size:16pt;color:var(--blue-d);}
  .round .rp{font-size:12.5pt;color:var(--orange-d);}
  .round .st{font-size:11.5pt;color:var(--muted);min-height:16px;}
  .round.done{border-color:#bfdcc7;background:#eaf3ec;cursor:pointer;}
  .round.done .st{color:var(--ok);}
  .round.locked{opacity:.45;cursor:not-allowed;border-style:dashed;}
  .round.locked:hover{border-color:var(--line);background:#fff;}

  .seats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:100%;}
  .seatsel{
    aspect-ratio:1/1;border:2px solid var(--line);border-radius:14px;background:#fff;
    cursor:pointer;font-family:"Times New Roman",serif;font-size:24pt;color:var(--blue-d);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    transition:all .13s;
  }
  .seatsel small{font-size:10.5pt;color:var(--muted);font-family:"FangSong","仿宋",serif;}
  .seatsel:hover{border-color:var(--blue);background:var(--blue-l);}
  .seatsel.sel{border-color:var(--orange);background:var(--orange-l);color:var(--orange-d);}

  .warnline{font-size:13pt;color:var(--orange-d);min-height:18px;text-align:center;line-height:1.5;}

  .hint{font-size:13pt;color:var(--muted);line-height:1.75;text-align:left;background:#f4f8fb;border-radius:12px;padding:13px 16px;width:100%;}
  .hint b{color:var(--blue-d);}

  /* 结算 */
  .sumrow{display:flex;justify-content:space-between;align-items:center;width:100%;border-bottom:1px dashed var(--line);padding:9px 2px;font-size:14pt;}
  .sumrow:last-child{border-bottom:none;}
  .sumrow .rt{color:var(--blue-d);}
  .sumrow .rr{font-size:13pt;}
  .sumrow .rr.ok{color:var(--ok);}
  .sumrow .rr.no{color:var(--muted);}
  .totalscore{font-size:15pt;color:var(--muted);}
  .totalscore b{font-family:"Times New Roman",serif;font-size:34pt;color:var(--orange-d);}

  .copytxt{
    width:100%;border:2px dashed var(--blue);border-radius:12px;padding:14px;
    background:var(--blue-l);font-size:15pt;color:var(--blue-d);word-break:break-all;line-height:1.6;
    text-align:center;
  }
  .copytxt .cb{font-family:"Times New Roman",serif;font-weight:bold;font-size:19pt;letter-spacing:2px;color:var(--orange-d);}

  .foot{width:100%;max-width:540px;text-align:center;font-size:11.5pt;color:#9aa8b2;margin-top:14px;line-height:1.6;}

  .toast{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    background:rgba(31,43,51,.92);color:#fff;padding:14px 22px;border-radius:12px;
    font-size:14pt;opacity:0;pointer-events:none;transition:all .2s;z-index:99;max-width:80%;text-align:center;line-height:1.5;
  }
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
</style>
</head>
<body>

  <div class="top">
    <h1>谁 是 卧 底</h1>
    <p>人力资源管理前沿 · 第4章 HRBP · 观众投票</p>
  </div>

  <div class="wrap">
    <div class="stage" id="stage"></div>
  </div>

  <div class="foot" id="foot">请勿把投票结果告诉他人，系统不会显示你的分数。</div>
  <div class="toast" id="toast"></div>

<script>
/* ================= 配置区 ================= */
const CONFIG = {
  seats: 8,                 // 总座位数
  spies: [2, 5],            // 本局卧底座位号（HRBP）
  maxVotes: 3,              // 每人最多投几轮
  rounds: 4,                // 总轮次
  // 各轮投对得分（下标0=第1轮）
  roundScore: [10, 8, 5, 3],
  doubleHitBonus: 5,        // 命中2个不同卧底额外加分
  // 校验码密钥（前端可见，仅防普通学生；请不要改）
  SECRET: "WodiHRBP#2026@Cressy$Mingyue%7749"
};
/* ========================================== */

/* ---------- 本地存储 ---------- */
const KEY = "wodi_vote_v1";
function save(){ localStorage.setItem(KEY, JSON.stringify(ST)); }
function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; }
}
function clearAll(){ localStorage.removeItem(KEY); }

let ST = load() || {
  name: "", sid: "", role: "",   // role: voter | player
  votes: {},                     // {1: seat, 2: seat, ...}
  finished: false
};
if(!ST.votes) ST.votes = {};

const stage = document.getElementById("stage");
const foot = document.getElementById("foot");

/* ---------- 工具 ---------- */
function toast(msg, ms=1600){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), ms);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- 校验码（复杂哈希，6位） ---------- */
/* FNV-1a 64 位变体 + 多轮混淆，输出 6 位大写字母数字 */
function hashCode(str){
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for(let i=0;i<str.length;i++){
    const c = str.charCodeAt(i);
    h1 ^= c; h1 = Math.imul(h1, 0x01000193);
    h2 = Math.imul(h2 ^ c, 0x85ebca6b);
    h2 ^= h2 >>> 13;
  }
  // 多轮混淆
  for(let r=0;r<8;r++){
    h1 ^= Math.imul(h1 >>> 7, 0x9e3779b1);
    h2 ^= Math.imul(h2 >>> 11, 0xc2b2ae35);
    h1 = (h1 << 13) | (h1 >>> 19);
    h2 = (h2 << 17) | (h2 >>> 15);
    h1 = Math.imul(h1 ^ h2, 0x27d4eb2f);
    h2 = Math.imul(h2 ^ h1, 0x165667b1);
  }
  return [h1>>>0, h2>>>0];
}
const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 去掉易混 I O 0 1
function checksum(name, sid, score){
  const seed = CONFIG.SECRET + "|" + name.trim() + "|" + String(sid).trim() + "|" + score;
  const [a,b] = hashCode(seed);
  let out = "";
  // 用两段哈希反复取样
  let x = a, y = b;
  for(let i=0;i<6;i++){
    x = Math.imul(x ^ (y >>> (i+1)), 0x9e3779b1) >>> 0;
    y = Math.imul(y ^ (x >>> (i+2)), 0x85ebca6b) >>> 0;
    out += ALPHABET[((x ^ y) >>> 0) % ALPHABET.length];
  }
  return out;
}

/* ---------- 计分 ---------- */
function computeScore(){
  const rounds = Object.keys(ST.votes).map(Number).sort((a,b)=>a-b);
  let total = 0;
  const detail = [];
  const hitSpies = new Set();
  rounds.forEach(r=>{
    const seat = ST.votes[r];
    const hit = CONFIG.spies.includes(seat);
    if(hit){ total += CONFIG.roundScore[r-1]; hitSpies.add(seat); }
    detail.push({round:r, seat, hit});
  });
  let bonus = 0;
  if(hitSpies.size >= 2){ bonus = CONFIG.doubleHitBonus; total += bonus; }
  return { total, detail, bonus };
}
function votesUsed(){ return Object.keys(ST.votes).length; }

/* ==================================================
   页面渲染
   ================================================== */

/* 1. 填写姓名学号 */
function renderReg(){
  if(ST.name && ST.sid){ renderIdentity(); return; }
  stage.innerHTML = `
    <div class="prompt">请先填写你的信息</div>
    <label class="field">姓名</label>
    <input type="text" id="inName" placeholder="例如：杜明月" value="${escapeHtml(ST.name||"")}">
    <label class="field">学号</label>
    <input type="text" id="inSid" placeholder="例如：2024010101" value="${escapeHtml(ST.sid||"")}">
    <div class="warnline" id="warn"></div>
    <button class="btnbig" id="btnNext">下 一 步</button>
  `;
  document.getElementById("btnNext").addEventListener("click", ()=>{
    const n = document.getElementById("inName").value.trim();
    const s = document.getElementById("inSid").value.trim();
    const w = document.getElementById("warn");
    if(!n){ w.textContent = "请填写姓名。"; return; }
    if(!s){ w.textContent = "请填写学号。"; return; }
    ST.name = n; ST.sid = s; save();
    renderIdentity();
  });
}

/* 2. 选择身份 */
function renderIdentity(){
  stage.innerHTML = `
    <div class="prompt"><b>${escapeHtml(ST.name)}</b>，请选择你的身份</div>
    <div class="idgrid">
      <button class="idcard" id="btnPlayer">
        <h3>🎭 我是游戏玩家</h3>
        <p>参与“谁是卧底”牌局 → 抽取你的角色（座位号 + 词语）</p>
      </button>
      <button class="idcard" id="btnVoter">
        <h3>👀 我是观众（投票）</h3>
        <p>轮到你判断时投票 → 猜谁才是卧底</p>
      </button>
    </div>
    <div class="warnline" id="warn"></div>
  `;
  document.getElementById("btnPlayer").addEventListener("click", ()=>{
    ST.role = "player"; save(); renderPlayer();
  });
  document.getElementById("btnVoter").addEventListener("click", ()=>{
    // 已投过票 → 直接进投票面板
    ST.role = "voter"; save();
    if(ST.finished){ renderResult(); } else { renderVotePanel(); }
  });
}

/* 3. 玩家 → 跳转选角色（新开页，保留名字） */
function renderPlayer(){
  const url = "https://mingyuecressy.github.io/wodi-game/";
  stage.innerHTML = `
    <div class="prompt">正在为你跳转到角色抽取页…</div>
    <div class="hint">
      玩家不需要投票。请在打开的页面中点击 <b>你自己的座位号</b>，查看你的词与身份。<br><br>
      如果没有自动跳转，请点击下方按钮。
    </div>
    <button class="btnbig orange" id="btnGo">前 往 抽 取 角 色</button>
  `;
  document.getElementById("btnGo").addEventListener("click", ()=>{ location.href = url; });
  setTimeout(()=>{ location.href = url; }, 900);
}

/* 4. 投票面板 */
function renderVotePanel(){
  if(ST.finished){ renderResult(); return; }
  const used = votesUsed();
  const full = used >= CONFIG.maxVotes;
  const roundsHtml = Array.from({length:CONFIG.rounds},(_,i)=>{
    const r = i+1;
    const voted = ST.votes[r] !== undefined;
    const cls = voted ? "done" : (full ? "locked" : "");
    const st = voted ? `已投 ${ST.votes[r]} 号` : (full ? "已投满三轮" : "点击投票");
    return `<div class="round ${cls}" data-round="${r}">
      <div class="rt">第 ${r} 轮</div>
      <div class="rp">投对 +${CONFIG.roundScore[i]} 分</div>
      <div class="st">${st}</div>
    </div>`;
  }).join("");
  stage.innerHTML = `
    <div class="prompt">选择要参与投票的轮次<br><span style="font-size:12.5pt;color:var(--muted);">最多投 ${CONFIG.maxVotes} 轮 · 已投 ${used}/${CONFIG.maxVotes}</span></div>
    <div class="rounds">${roundsHtml}</div>
    <div class="warnline" id="warn">${used>0 ? "投完记得点下方按钮查看结果。" : "分数不会即时显示，凭你的判断投。 "}</div>
    <button class="btnbig orange" id="btnFinish" ${used===0?"disabled":""}>投 票 结 束 · 查 看 结 果</button>
  `;
  stage.querySelectorAll(".round").forEach(el=>{
    el.addEventListener("click", ()=>{
      const r = +el.dataset.round;
      if(ST.votes[r] !== undefined){ toast("该轮已投过，不能重复投。"); return; }
      if(votesUsed() >= CONFIG.maxVotes){ toast("已投满三轮，不能再投了。"); return; }
      renderSeatPick(r);
    });
  });
  document.getElementById("btnFinish").addEventListener("click", ()=>{
    if(votesUsed()===0){ toast("你还没有投票。"); return; }
    ST.finished = true; save(); renderResult();
  });
}

/* 5. 选座位 */
function renderSeatPick(r){
  const seatsHtml = Array.from({length:CONFIG.seats},(_,i)=>{
    const s = i+1;
    return `<div class="seatsel" data-seat="${s}">${s}<small>号</small></div>`;
  }).join("");
  stage.innerHTML = `
    <div class="prompt">第 ${r} 轮 · 你认为谁是卧底？<br><span style="font-size:12.5pt;color:var(--muted);">选 1 人（投对 +${CONFIG.roundScore[r-1]} 分）</span></div>
    <div class="seats">${seatsHtml}</div>
    <div class="warnline" id="warn">点击座位号选择，再点一次确认。</div>
    <button class="smallbtn" id="btnBack">返 回</button>
  `;
  let sel = null;
  stage.querySelectorAll(".seatsel").forEach(el=>{
    el.addEventListener("click", ()=>{
      const seat = +el.dataset.seat;
      const w = document.getElementById("warn");
      if(sel !== seat){
        stage.querySelectorAll(".seatsel").forEach(x=>x.classList.remove("sel"));
        el.classList.add("sel"); sel = seat;
        w.textContent = `确认投给 ${seat} 号？再点一次确定。`;
        return;
      }
      ST.votes[r] = seat; save();
      toast(`第 ${r} 轮已投票`);
      renderVotePanel();
    });
  });
  document.getElementById("btnBack").addEventListener("click", ()=>renderVotePanel());
}

/* 6. 结算 */
function renderResult(){
  const { total, detail, bonus } = computeScore();
  const code = checksum(ST.name, ST.sid, total);
  const rows = detail.map(d=>`
    <div class="sumrow">
      <span class="rt">第 ${d.round} 轮 → 投给 ${d.seat} 号</span>
      <span class="rr ${d.hit?"ok":"no"}">${d.hit?`✅ 正确 +${CONFIG.roundScore[d.round-1]}`:"❌ 未命中 +0"}</span>
    </div>`).join("");
  const bonusRow = bonus ? `<div class="sumrow"><span class="rt">命中两名卧底</span><span class="rr ok">✅ 额外 +${bonus}</span></div>` : "";
  const copyText = `${ST.name} ${ST.sid} ${total}分 ★${code}`;
  stage.innerHTML = `
    <div class="prompt">🎉 投票结果揭晓</div>
    <div style="width:100%;">${rows}${bonusRow}</div>
    <div class="totalscore">你的总分：<b>${total}</b> 分</div>
    <div class="warnline">本局卧底是 <b>2 号 与 5 号（HRBP）</b></div>
    <div class="copytxt" id="copyTxt">${escapeHtml(ST.name)} ${escapeHtml(ST.sid)} <b>${total}分</b> <span class="cb">★${code}</span></div>
    <button class="btnbig" id="btnCopy">📋 复 制 结 果（发到学习通群）</button>
    <button class="smallbtn" id="btnShot">结果页请截图，与文本一起发给我</button>
    <div class="hint">
      1️⃣ 点击上方按钮复制文本 → 粘贴到学习通群；<br>
      2️⃣ 同时给本页<b>截图</b>一起发送（文字+截图双重核对）。
    </div>
  `;
  document.getElementById("btnCopy").addEventListener("click", async ()=>{
    try{ await navigator.clipboard.writeText(copyText); toast("已复制！粘贴到学习通群即可"); }
    catch(e){
      const ta = document.createElement("textarea");
      ta.value = copyText; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast("已复制！"); }catch(_){ prompt("手动复制：", copyText); }
      document.body.removeChild(ta);
    }
  });
  document.getElementById("btnShot").addEventListener("click", ()=>toast("请用手机截图本页"));
}

/* ---------- 启动 ---------- */
if(ST.finished && ST.role==="voter"){ renderResult(); }
else if(ST.name && ST.sid){ renderIdentity(); }
else { renderReg(); }
</script>
</body>
</html>
